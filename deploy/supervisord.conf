; PulseHub 进程托管：uvicorn(API，仅容器内回环 8000) + nginx(静态站点 + /api 反代 80)
; 两个进程都在同一容器内，对外只经 nginx 的 80 端口暴露。

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:api]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --proxy-headers
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:web]
command=/usr/local/bin/start-nginx.sh
autostart=true
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
