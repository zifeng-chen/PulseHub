# PulseHub 单容器部署
# 一个容器里同时跑：nginx（静态站点 + /api 反代）+ FastAPI（uvicorn，仅容器内回环）。
# 对外只有一个端口：6065 → 容器 80；前端与接口同源，不再单独暴露后端端口。
# 数据库仍使用 NAS 上既有的 MySQL（通过宿主 IP 访问，口令写在 deploy/pulsehub.env）。
# 不引入 Redis / MQ / ES / 独立向量数据库；不使用后台任务与 Worker。

name: pulsehub

services:
  pulsehub:
    container_name: PulseHub
    image: pulsehub:2.1.0
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./deploy/pulsehub.env
    ports:
      # 不要写 "0.0.0.0:6065:80"：显式 0.0.0.0 会让 Docker 只绑 IPv4，
      # DDNS 解析到 IPv6（AAAA）时外网打不开。留空主机地址让 Docker 自动双栈。
      - "6065:80"
    volumes:
      # 附件与备份必须持久化到宿主（24 §4 / §2）
      - ./data/attachments:/app/data/attachments
      - ./data/backups:/app/data/backups
    networks:
      - pulsehub-net
    restart: unless-stopped
    healthcheck:
      # 走 nginx 的 /api 反代，等价于同时验证 nginx + uvicorn 都活着
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # 首次启动要跑 alembic 迁移，给足冷启动时间
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  pulsehub-net:
    driver: bridge
