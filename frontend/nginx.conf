# FAM V2.1 前端站点配置
# - SPA 使用 history 模式，未匹配路径回退 index.html（避免刷新 404）
# - /api 反向代理到后端容器，使前端与接口保持同源（无需处理 CORS）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 内容安全策略：只允许同源脚本，杜绝外部脚本注入（Vue 运行时需要内联样式）
    set $fam_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    add_header Content-Security-Policy $fam_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 静态资源长缓存（构建产物带内容哈希）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 反向代理后端 API
    location /api/ {
        proxy_pass http://fam-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;   # 兼容 AI 流式输出
    }

    location /health {
        proxy_pass http://fam-api:8000/api/v1/health;
        proxy_set_header Host $host;
    }

    # PWA 清单必须用标准 MIME，否则部分浏览器不识别（会退化成下载）
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # index.html 不做强缓存。
    # 否则浏览器会启发式缓存入口 HTML，发版后仍加载旧 chunk 列表，
    # 用户看到的是"功能没更新"（改了代码却找不到按钮）。
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 内容安全策略：只允许同源脚本，杜绝外部脚本注入（Vue 运行时需要内联样式）
    set $fam_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    add_header Content-Security-Policy $fam_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
